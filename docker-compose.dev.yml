# Env vars: `.env` (your existing one, unchanged) plus `.env.docker` (copy
# from .env.docker.example — overrides DATABASE_URL/REDIS_URL to point at
# THIS file's own `postgres`/`redis` services instead of your host machine).
# See .env.docker.example for why.
#
# Postgres/Redis are full services in this stack (not your host's DBngin
# instance) so a fresh clone needs nothing installed locally beyond Docker —
# no local Postgres/Redis, no host firewall/listen_addresses config. Their
# data lives in the `postgres_data`/`redis_data` named volumes below, so it
# survives `docker compose down` (but not `down -v`) — this is a separate,
# empty database from whatever your native `npm run dev` talks to.
#
# `web`'s API_URL is set here directly (not in an env file) — it's
# Docker-topology-specific (the compose service name `api`, resolved via
# Docker's built-in DNS), not a secret.

# Two more anonymous volumes on every service, same "bind mount would
# overlay a Linux-built directory with the Windows host's copy" problem as
# node_modules:
#   /app/.nx                       — Nx's own cache/daemon state. Sharing it
#                                     across three simultaneously-running
#                                     `nx` processes (one per container) via
#                                     the bind mount causes false-positive
#                                     "recursive task invocation" errors —
#                                     each container needs its own isolated
#                                     copy, not the host's (or each other's).
#                                     If this ever misfires again (e.g. after
#                                     a hard crash/force-quit), clear it with
#                                     `docker compose -f docker-compose.dev.yml down -v`.
#   /app/libs/uptime-db/src/generated — the *Linux* Prisma engine binary
#                                     baked in at image build time; `web`
#                                     never imports @uptime/uptime-db, so it
#                                     doesn't need this one.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime_db
    # No `ports:` published to the host on purpose — only `api`/`worker`
    # need to reach this, over Docker's internal network (service name
    # `postgres`), and plenty of machines already have something bound to
    # the default 5432/6379 (e.g. a local Postgres/Redis install), which
    # would otherwise fail this stack's startup with a port-conflict error.
    # Need host access anyway (e.g. Prisma Studio, redis-cli)? Run it
    # through the container instead: `docker compose -f docker-compose.dev.yml exec postgres psql -U postgres uptime_db`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    env_file:
      - .env
      - .env.docker
    environment:
      # Each container runs its own `nx serve`/`nx dev`/`nx build` — without
      # this, all three would try to coordinate through the SAME Nx daemon
      # state (bind-mounted in via `.nx/`, shared across containers) and
      # produce false-positive "recursive task invocation" errors, since Nx
      # sees another container's in-progress task and mistakes it for a
      # cycle in its own chain. Disabling the daemon makes each `nx` call
      # fully standalone — the documented fix for exactly this scenario.
      NX_DAEMON: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4001:4001'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
      - /app/libs/uptime-db/src/generated
    init: true

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    env_file:
      - .env
      - .env.docker
    environment:
      API_URL: http://api:4001
      NX_DAEMON: 'false'
    depends_on:
      - api
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    init: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: dev
    env_file:
      - .env
      - .env.docker
    environment:
      NX_DAEMON: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4002:4002'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
      - /app/libs/uptime-db/src/generated
    init: true

volumes:
  postgres_data:
  redis_data:
