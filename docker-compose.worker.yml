# Phase 2, Server 2 — a second, separate DigitalOcean VPS running
# apps/worker alone, plus nginx fronting its Bull Board (/admin/queues,
# already Basic-Auth-gated by BULL_BOARD_USER/PASS) and /health.
#
# Plain HTTP for now, deliberately — no TLS/Let's Encrypt here (see
# nginx/worker.conf.template). Re-add scripts/init-letsencrypt.sh's
# certbot service + port 443 later if this needs to be internet-facing
# over HTTPS.
#
# Env: copy .env.worker.example -> .env.worker and fill in real values.
# Never committed — see .gitignore.
#
# Uncomment the signal-cli-rest-api service below only if you want it
# co-located on this server (matches CLAUDE.md's default) rather than
# already running elsewhere — if you uncomment it, also set
# SIGNAL_REST_API_URL=http://signal-cli-rest-api:8080 in .env.worker.

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
    env_file:
      - .env.worker
    expose:
      - '4002'
    init: true
    restart: unless-stopped
    # depends_on: [signal-cli-rest-api]   # uncomment together with the service below

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/worker.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '80:80'
    depends_on:
      - worker
    restart: unless-stopped

