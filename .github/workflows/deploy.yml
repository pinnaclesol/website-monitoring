name: Deploy to production

# Every push to main redeploys the single-server production stack.
# SSHes in and runs scripts/redeploy.sh docker-compose.prod.yml.
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy production server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: SSH in and redeploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@${{ secrets.SERVER_HOST || secrets.APP_SERVER_HOST }} \
            'cd /var/www/website-monitoring && bash ./scripts/redeploy.sh docker-compose.prod.yml'
