# Single combined DigitalOcean VPS running `api` + `web` + `worker` + `signal-bridge`,
# plus nginx as a reverse proxy — all services consolidated onto one server.
# Postgres/Redis are externally managed (DigitalOcean Managed Databases).
#
# Plain HTTP for now — no TLS/Let's Encrypt here (see nginx/prod.conf.template).
#
# Env: copy .env.prod.example -> .env.prod (or .env.production) and fill in real values.
#
# `api` publishes NO host port — only reachable by other containers on this
# compose network (`web`'s server-side proxy talks to it at http://api:4001).
# nginx is the only container with a host port (80), and it forwards to
# `web:4000` (default) or `worker:4002` (/admin/queues, /worker-health, /health).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    env_file:
      - path: .env.prod
        required: false
      - path: .env.production
        required: false
    environment:
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - signal-bridge
    expose:
      - '4001'
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    env_file:
      - path: .env.prod
        required: false
      - path: .env.production
        required: false
    environment:
      API_URL: http://api:4001
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - api
    expose:
      - '4000'
    volumes:
      # Persists uploaded branding images (apps/web/app/api/upload/route.ts)
      # across redeploys — writes to /app/apps/web/public/uploads.
      - uploads_data:/app/apps/web/public/uploads
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
    env_file:
      - path: .env.prod
        required: false
      - path: .env.production
        required: false
    environment:
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - api
      - signal-bridge
    expose:
      - '4002'
    init: true
    restart: unless-stopped

  signal-bridge:
    image: bbernhard/signal-cli-rest-api:latest-dev
    container_name: signal-bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    volumes:
      - ./signal-data:/home/.local/share/signal-cli
    environment:
      - MODE=json-rpc
      - LOG_LEVEL=debug

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Served directly by nginx (see nginx/prod.conf.template's /uploads/
      # location) instead of proxied to `web`.
      - uploads_data:/uploads:ro
    ports:
      - '80:80'
    depends_on:
      - web
      - worker
    restart: unless-stopped

volumes:
  uploads_data:
