# Single-server production Docker Compose stack running:
# - `api`: NestJS backend (port 4001 internal, BullMQ check producer)
# - `web`: Next.js frontend (port 4000 internal)
# - `worker`: NestJS background worker (port 4002 internal, BullMQ consumer, check engine)
# - `signal-bridge`: Signal CLI REST API sidecar (port 8080 internal)
# - `nginx`: Single public reverse proxy on port 80 (and 443 if SSL configured)
#
# Env: copy .env.prod.example -> .env.production and fill in your values.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    env_file:
      - .env.production
    environment:
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - signal-bridge
    expose:
      - '4001'
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    env_file:
      - .env.production
    environment:
      API_URL: http://api:4001
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - api
    expose:
      - '4000'
    volumes:
      - uploads_data:/app/apps/web/public/uploads
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
    env_file:
      - .env.production
    environment:
      SIGNAL_REST_API_URL: http://signal-bridge:8080
    depends_on:
      - api
      - signal-bridge
    expose:
      - '4002'
    init: true
    restart: unless-stopped

  signal-bridge:
    image: bbernhard/signal-cli-rest-api:latest-dev
    container_name: signal-bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    volumes:
      - ./signal-data:/home/.local/share/signal-cli
    environment:
      - MODE=json-rpc
      - LOG_LEVEL=debug

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - uploads_data:/uploads:ro
    ports:
      - '80:80'
    depends_on:
      - web
      - worker
    restart: unless-stopped

volumes:
  uploads_data:
