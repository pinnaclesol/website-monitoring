# Phase 2, Server 1 — one DigitalOcean VPS running `api` + `web` as two
# separate containers (never merged into one image) plus nginx as a
# reverse proxy. Postgres/Redis are externally managed (DigitalOcean
# Managed Databases) — nothing here provisions a database.
#
# Plain HTTP for now, deliberately — no TLS/Let's Encrypt here (see
# nginx/web-api.conf.template). Re-add scripts/init-letsencrypt.sh's
# certbot service + port 443 later once this needs to be HTTPS (also
# switch NEXTAUTH_URL in .env.web-api back to https:// at that point).
#
# Env: copy .env.web-api.example -> .env.web-api and fill in real values
# (managed Postgres/Redis connection strings, generated secrets). Never
# committed — see .gitignore.
#
# `api` publishes NO host port — only reachable by other containers on this
# compose network (`web`'s server-side proxy talks to it at
# http://api:4001). nginx is the only container with a host port, and it
# only forwards to `web:4000` — this is what keeps apps/api genuinely
# unreachable from the internet, not just "not linked to" by convention.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    env_file:
      - .env.web-api
    expose:
      - '4001'
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    env_file:
      - .env.web-api
    environment:
      API_URL: http://api:4001
    depends_on:
      - api
    expose:
      - '4000'
    volumes:
      # Persists uploaded branding images (apps/web/app/api/upload/route.ts)
      # across redeploys/`docker compose up --build` — that route writes to
      # <cwd>/public/uploads, and Dockerfile.web's production stage runs
      # `next start` from /app/apps/web, so that's exactly this path.
      - uploads_data:/app/apps/web/public/uploads
    init: true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/web-api.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '80:80'
    depends_on:
      - web
    restart: unless-stopped

volumes:
  uploads_data:
